name: Update gig list

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gigs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch gigs
        run: python run.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
      - name: Commit changes
        run: |
          git config user.name "gig-bot"
          git config user.email "gig-bot@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update gig list"
            git push
          fi
